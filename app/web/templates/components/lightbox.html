<div x-show="lightboxOpen" x-cloak
     @keydown.escape.window="closeLightbox()"
     @click.self="closeLightbox()"
     class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-6">
  <div class="card max-w-5xl w-full max-h-full overflow-auto p-4 relative" @click.stop>
    <button class="absolute top-2 right-2 text-zinc-400 hover:text-white text-2xl" @click="closeLightbox()">×</button>
    <div class="grid md:grid-cols-2 gap-4">
      <img :src="lightboxData?.src" alt="" class="w-full h-auto rounded">
      <div class="text-sm space-y-2">
        <div>
          <div class="text-zinc-400 text-xs">PROMPT</div>
          <div class="whitespace-pre-wrap" x-text="lightboxData?.prompt"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div><span class="text-zinc-400">Size:</span> <span x-text="(lightboxData?.width || '') + '×' + (lightboxData?.height || '')"></span></div>
          <div><span class="text-zinc-400">Seed:</span> <span x-text="lightboxData?.seed || ''"></span></div>
        </div>
        <div class="flex gap-2 pt-2">
          <a class="btn-secondary btn text-xs" :href="lightboxData ? lightboxData.src + '?download=1' : '#'" download>Download</a>
        </div>
      </div>
    </div>
  </div>
</div>
